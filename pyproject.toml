[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-voice-platform"
version = "0.1.0"
description = "Production-Oriented AI Voice Platform - 48-Hour Assessment"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "websockets>=12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "q1_voice_agent/tests", "q2_knowledge_base/tests", "q3_multilingual/tests", "q4_realtime/tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
pythonpath = ["."]
